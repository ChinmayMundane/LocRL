name: Reproduction checks
on: [push, pull_request]
jobs:
  reproduce-results:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q capql pc_sac fixed_sac environment planners experiments
      - run: python experiments/summarize_final_study.py
      - run: python experiments/summarize_final_study.py --table 3
      - run: python experiments/summarize_final_study.py --table 4
      - run: python experiments/analyze_zero_contact_results.py
